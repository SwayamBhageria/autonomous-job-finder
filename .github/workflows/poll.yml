name: job-finder

# NOTE: the scheduled trigger is intentionally commented out in this public
# repo — without a profile.yaml (gitignored: it holds your identity, CV, and
# salary floor) every run would fail. Uncomment it once you've configured your
# own fork and added the repo secrets.
on:
  # schedule:
  #   # Was "0,30 * * * *". That asked for 48 runs a day and GitHub delivered
  #   # 8-21 (median gap 97 min, measured over a week) — the extra ticks were
  #   # never real, they just made the cadence unpredictable and re-fetched 27k
  #   # postings across 212 boards for nothing. Hourly is what actually happens,
  #   # said out loud. It costs no supply: a role posted at 09:05 is found at
  #   # 10:00 either way, and you work the cockpit once or twice a day.
  #   - cron: "0 * * * *"
  workflow_dispatch:            # lets you trigger a run by hand from the Actions tab
    inputs:
      test_slack:
        description: "Send a Slack test ping instead of polling"
        type: boolean
        default: false
      golive:
        description: "Re-score ALL currently-open matches and notify (after adding boards / lowering the bar)"
        type: boolean
        default: false
      backlog:
        description: "Score ALL open matches and upload queue.html as an artifact (no Slack, no state change)"
        type: boolean
        default: false

permissions:
  contents: write               # to commit the updated seen_jobs.json back

# cancel-in-progress used to be false, to protect the state write from being
# killed mid-flight. That cost a 23-hour Slack blackout on 2026-07-25: one run
# sat in `queued` for 23h without ever being assigned a runner, and because a
# waiting run holds the group, every scheduled run behind it was cancelled in
# turn. Nothing polled, so not even the heartbeat fired — a silent stall.
# True is the self-healing choice here: a poll takes ~1 min and the cron is 30
# min apart, so a run still alive when the next one starts is hung by
# definition and worth killing. Worst case we lose one state write and a few
# roles get re-alerted once — far cheaper than a day of silence.
concurrency:
  group: job-finder
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    # Belt to the concurrency braces: caps a hung *running* job. (It does not
    # apply while a job is queued — that case is what cancel-in-progress covers.)
    # 20 → 30: a --golive scores every open match, and the 2026-08-09 sweep took
    # 15m37s for 707 roles before outreach drafts. A normal poll is ~1 min, so
    # this only ever binds on a full sweep — and a sweep killed after Slack but
    # before the state write re-alerts the whole batch on the next run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Slack test ping (sample alert)
        if: inputs.test_slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python notify.py

      - name: Poll boards and notify
        if: ${{ !inputs.test_slack && !inputs.backlog }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ats.adzuna reads these from the environment and returns [] when
          # unset — so without them the aggregator no-ops silently in CI.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python poller.py ${{ inputs.golive && '--golive' || '' }}

      # Backlog sweep: scores every currently-open match (not just the new
      # ones) and produces the full ranked apply queue as a downloadable page.
      # Deliberately touches neither Slack nor the state file.
      - name: Build backlog apply queue
        if: ${{ inputs.backlog }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python poller.py --backlog

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.backlog }}
        with:
          name: apply-queue
          path: queue.html
          retention-days: 14

      - name: Persist seen-jobs state
        if: ${{ !inputs.test_slack && !inputs.backlog }}
        run: |
          git config user.name  "job-finder-bot"
          git config user.email "actions@github.com"
          # board_health.json has to survive the run too: it counts how many runs
          # in a row a board has failed, and the Slack alert only fires on the
          # third. Left uncommitted, the runner's copy is discarded, the count
          # resets to 1 every run, and the alert never fires at all — which is
          # precisely the silence that let Tekion 404 for days.
          # Whole directory rather than a file list, so a run that hasn't written
          # board_health.json yet can't fail the step on an unmatched pathspec.
          git add state/
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "state: update seen jobs + outreach [skip ci]"
          # A bare `git push` fails whenever anything else lands on main during
          # the run (a hand-pushed commit, or an overlapping scheduled run).
          # That's not cosmetic: losing the state write means every role in this
          # batch is "new" again next run and gets re-alerted. Rebase and retry.
          for attempt in 1 2 3; do
            if git push; then
              echo "State pushed (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt/3)…"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1

      # ── Dead-man's switch ────────────────────────────────────────
      # A dead poller and a quiet job market look identical from your phone:
      # Slack silence. That already cost a 24h blackout on 2026-07-25, when a run
      # stuck in `queued` held the concurrency group — and nothing inside this
      # workflow can ever catch that, because the detector would have to run.
      #
      # So a successful poll stamps a heartbeat on his always-on Oracle VM, which
      # alerts by Bark push when the stamps stop. The direction is deliberate:
      # having the VM poll the GitHub API instead would need a token, and
      # fine-grained tokens expire silently — a watchdog that dies with its own
      # credential is the exact failure it exists to prevent. The SSH key here is
      # locked to a forced `touch` on the VM and can do nothing else.
      #
      # `continue-on-error` + `|| true`: the watchdog must never be able to fail
      # a poll that otherwise worked. A VM problem is not a job-finder problem.
      - name: Stamp watchdog heartbeat
        if: ${{ !inputs.test_slack && !inputs.backlog }}
        continue-on-error: true
        env:
          KEY:  ${{ secrets.WATCHDOG_SSH_KEY }}
          HOST: ${{ secrets.WATCHDOG_HOST }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "No watchdog secrets configured — skipping heartbeat."
            exit 0
          fi
          install -m 600 /dev/null /tmp/wd_key
          printf '%s\n' "$KEY" > /tmp/wd_key
          ssh -i /tmp/wd_key -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 "$HOST" true \
            && echo "Watchdog heartbeat stamped." \
            || echo "::warning::Could not reach the watchdog VM — heartbeat not stamped."
          rm -f /tmp/wd_key
