  #  Jul-23 sweeps showed that well is nearly dry for India: ~490 companies
  #  probed across two rounds yielded 18 boards and ~135 India roles. Adzuna
  #  instead aggregates thousands of Indian sources behind one API, so it is
  #  the only lever here that scales without more hand-probing.
  #  INERT until both secrets exist — free keys at https://developer.adzuna.com
  #  then: gh secret set ADZUNA_APP_ID -b '…' ; gh secret set ADZUNA_APP_KEY -b '…'
  #  Each job keeps its REAL employer name, so dedupe, the per-company cap and
  #  the referral lookup all still work. ~5 calls/run against a ~1000/month tier.
  - {name: Adzuna India, ats: adzuna, token: ""}

