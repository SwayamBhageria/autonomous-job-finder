  # ── Aggregator — OFF, 2026-08-09. A deliberate call, and the numbers agree ──
  #  Adzuna aggregates thousands of Indian sources behind one API, which made it
  #  the only lever that scaled without hand-probing each company. It is off
  #  because it returns a ~200-char TEASER, never a job description.
  #
  #  That is fatal against the current gates, and the arithmetic is not close:
  #      _snippet_note()    marks a desc < 400 chars "[PARTIAL LISTING]"
  #      unverified_ceiling caps anything so marked at 65
  #      notify_threshold   is 70   → an Adzuna row can never reach A-tier
  #      bulk_threshold     is 70   → and with B off there is nowhere below it
  #  Measured on the 2026-08-09 sweep: 200 postings → 87 title/location matches
  #  → 0 reached A-tier, while every other source produced some (Workday 23,
  #  Oracle 9, SmartRecruiters 7). It was pure cost: ~15 calls/day, and 87
  #  phantom "matches" per run making supply look healthier than it was.
  #
  #  WHY IT LOOKED LIKE IT WORKED, which is the part worth not re-learning:
  #  before 2026-08-08 the unread ceiling was ALSO 70, so "we could not read
  #  this JD" and "this is referral-worthy" were the same number. 17 of its 34
  #  cockpit rows sat at exactly 70 and 31 of 34 read "unverified JD". Moving
  #  the ceiling to 65 did not break Adzuna — it revealed that Adzuna had never
  #  been contributing, only inflating the count.
  #
  #  Re-enabling it needs a REAL JD, not a lower bar — the explicit call is
  #  that bulk rows with no JD are not wanted, so dropping bulk_threshold back
  #  to 48 to catch these is the wrong fix. The teaser links to an adzuna.in
  #  landing page (not the employer), and that page answers 429 to the very
  #  first anonymous request — so a GitHub runner cannot fetch it. If it ever
  #  comes back it goes through harvest/ on a local Mac like Naukri, and only then.
  #  Note company_exclude in filters.yaml STAYS: the harvest inbox feeds the
  #  same staffing-firm reposts this list was grown to screen.
  # - {name: Adzuna India, ats: adzuna, token: ""}

